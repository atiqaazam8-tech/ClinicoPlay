<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Unity WebGL Player | ClinicoPlay</title>
    <!-- Favicon removed -->
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div class="bg-orb orb-1"></div>
      <div class="bg-orb orb-2"></div>
      <div class="bg-orb orb-3"></div>
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px;"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-percent">0%</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-text">Preparing assets...</div>
        <div id="unity-error-box" style="display:none;margin-top:16px;">
          <div id="unity-error-message" style="font-size:12px;color:#fca5a5;margin-bottom:12px;text-align:center;"></div>
          <button id="unity-retry-btn" onclick="location.reload()" style="background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;border:none;border-radius:12px;padding:10px 24px;font-size:13px;font-weight:600;cursor:pointer;width:100%;letter-spacing:0.05em;">Retry</button>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </div>
        <div id="unity-build-title">ClinicoPlay</div>
      </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
      // YOUR FIREBASE CONFIGURATION
      const firebaseConfig = {
        apiKey: "AIzaSyAvKGHsLjCXY-I5-7SP8UIq9VmJ5qohBhg",
        authDomain: "quiz-online-5bcd1.firebaseapp.com",
        databaseURL: "https://quiz-online-5bcd1-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "quiz-online-5bcd1",
        storageBucket: "quiz-online-5bcd1.firebasestorage.app",
        messagingSenderId: "1051342331393",
        appId: "1:1051342331393:web:89d8d12bdbf346713f6a00"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Force Portrait Responsive Scaling (9:16)
      function resizeCanvas() {
        var windowWidth = window.innerWidth;
        var windowHeight = window.innerHeight;
        var targetAspectRatio = 9 / 16;
        var currentAspectRatio = windowWidth / windowHeight;

        if (currentAspectRatio < targetAspectRatio) {
          // Narrow screen (e.g., mobile portrait)
          canvas.style.width = windowWidth + "px";
          canvas.style.height = (windowWidth / targetAspectRatio) + "px";
        } else {
          // Wide screen (e.g., desktop monitor)
          canvas.style.height = windowHeight + "px";
          canvas.style.width = (windowHeight * targetAspectRatio) + "px";
        }
      }

      window.addEventListener('resize', resizeCanvas);
      document.addEventListener('fullscreenchange', resizeCanvas);
      document.addEventListener('webkitfullscreenchange', resizeCanvas);
      resizeCanvas();

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ClinicoPlay.loader.js";
      var config = {
        dataUrl: buildUrl + "/ClinicoPlay.data.unityweb",
        frameworkUrl: buildUrl + "/ClinicoPlay.framework.js.unityweb",
        codeUrl: buildUrl + "/ClinicoPlay.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ClinicoPlay",
        productName: "ClinicoPlay",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      var myUnityInstance = null;

      // Friendly error display — avoids browser alert() which causes "Script error." on cross-origin builds
      function showLoadError(msg) {
        var errorBox = document.getElementById("unity-error-box");
        var errorMsg = document.getElementById("unity-error-message");
        var statusText = document.querySelector("#unity-loading-text");
        if (errorMsg) errorMsg.innerText = msg || "Failed to load. Please check your connection and try again.";
        if (errorBox) errorBox.style.display = "block";
        if (statusText) statusText.style.display = "none";
        document.getElementById("unity-progress-bar-empty").style.display = "none";
        document.getElementById("unity-progress-percent").style.display = "none";
        loadingBar.style.opacity = 1;
        loadingBar.style.display = "flex";
        console.error("[Unity Load Error]", msg);
      }

      // Intercept global script errors so Unity's cross-origin "Script error." alert never fires
      window.onerror = function(message, source, lineno, colno, error) {
        // Only intercept Unity's own error handler (avoid masking real JS errors)
        if (message === "Script error." || (source && source.indexOf(loaderUrl) !== -1)) {
          showLoadError("A script error occurred loading the game. Try refreshing or use a different browser.");
          return true; // Suppress the alert
        }
        return false;
      };

      script.onerror = function() {
        showLoadError("Could not download game files. Check your internet connection and try again.");
      };

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percent = Math.round(progress * 100);
          progressBarFull.style.width = percent + "%";
          document.querySelector("#unity-progress-percent").innerText = percent + "%";
          
          var statusText = document.querySelector("#unity-loading-text");
          if (progress < 0.2) {
            statusText.innerText = "Downloading game assets...";
          } else if (progress < 0.5) {
            statusText.innerText = "Loading quiz database & audio...";
          } else if (progress < 0.8) {
            statusText.innerText = "Compiling WebGL code...";
          } else {
            statusText.innerText = "Launching ClinicopPlay...";
          }
        }).then((unityInstance) => {
          myUnityInstance = unityInstance;
          loadingBar.style.opacity = 0;
          setTimeout(() => {
            loadingBar.style.display = "none";
            container.classList.add("unity-loaded");
          }, 600);
          fullscreenButton.onclick = () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
              if (container.requestFullscreen) {
                container.requestFullscreen();
              } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
              }
            } else {
              if (document.exitFullscreen) {
                document.exitFullscreen();
              } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
              }
            }
          };
        }).catch((message) => {
          // Never call alert() — show the error in our custom UI instead
          showLoadError(message);
        });
      };
      document.body.appendChild(script);

      // Detect very old or unsupported browsers early
      (function() {
        var ua = navigator.userAgent || "";
        // Warn if Android 4.x or very old iOS
        var isOldAndroid = /Android [1-4]\./.test(ua);
        var isOldIOS = /OS [1-9]_/.test(ua) && /iPhone|iPad|iPod/.test(ua);
        if (isOldAndroid || isOldIOS) {
          showLoadError("Your device browser may be too old to run this game. Please update your browser or try Chrome.");
        }
      })();

      // --- FIREBASE BRIDGE FUNCTIONS ---

      // Helper: retry a Firebase async call up to `maxRetries` times on network errors
      async function retryAsync(fn, maxRetries) {
        var retries = 0;
        while (true) {
          try {
            return await fn();
          } catch (err) {
            var isNetworkError = err.code === 'auth/network-request-failed' ||
                                 (err.message && err.message.toLowerCase().indexOf('network') !== -1);
            if (isNetworkError && retries < maxRetries) {
              retries++;
              console.warn('[Firebase] Network error, retrying (' + retries + '/' + maxRetries + ')...');
              await new Promise(function(r) { setTimeout(r, 2000 * retries); });
            } else {
              throw err;
            }
          }
        }
      }

      window.firebaseRegisterUser = async (email, password, obj, cb, fb) => {
          try {
              await retryAsync(() => firebase.auth().createUserWithEmailAndPassword(email, password), 2);
              myUnityInstance.SendMessage(obj, cb, "Account created successfully!");
          } catch (error) {
              myUnityInstance.SendMessage(obj, fb, error.message);
          }
      };

      window.firebaseLoginUser = async (email, password, obj, cb, fb) => {
          try {
              await retryAsync(() => firebase.auth().signInWithEmailAndPassword(email, password), 2);
              myUnityInstance.SendMessage(obj, cb, "Logged in successfully!");
          } catch (error) {
              myUnityInstance.SendMessage(obj, fb, error.message);
          }
      };

      window.firebaseGoogleLogin = async (obj, cb, fb) => {
          try {
              const provider = new firebase.auth.GoogleAuthProvider();
              await firebase.auth().signInWithPopup(provider);
              myUnityInstance.SendMessage(obj, cb, "Google login successful!");
          } catch (error) {
              myUnityInstance.SendMessage(obj, fb, error.message);
          }
      };

      window.firebaseResetPassword = async (email, obj, cb, fb) => {
          try {
              await firebase.auth().sendPasswordResetEmail(email);
              myUnityInstance.SendMessage(obj, cb, "Password reset email sent!");
          } catch (error) {
              myUnityInstance.SendMessage(obj, fb, error.message);
          }
      };

      window.firebaseLogAnswer = async (questionText, selectedOption, isCorrect, score) => {
try {
              const user = firebase.auth().currentUser;
              const userId = user ? user.uid : "anonymous";
              const email = user ? user.email : "anonymous";
              const timestamp = new Date().toISOString();

              const data = {
                  userId: userId,
                  email: email,
                  question: questionText,
                  selectedOption: selectedOption,
                  isCorrect: isCorrect ? true : false,
                  score: score,
                  timestamp: timestamp
              };

              console.log("[Firebase Logging] Preparing to save answer data:", data);

              // 1. Try Realtime Database (push entry)
              try {
                  await firebase.database().ref("responses").push(data);
                  console.log("[Firebase] Successfully logged answer to Realtime Database!");
              } catch (e) {
                  console.warn("[Firebase] Realtime Database logging skipped or failed:", e.message);
              }

              // Firestore attempt removed because it hangs indefinitely if Firestore is not initialized in the Firebase Console.

              // 3. Update Realtime Database Aggregated Stats via Atomic Transaction
              try {
                  // Sanitize keys for Firebase compatibility (remove forbidden characters: . $ # [ ] /)
                  const sanitizedQuestion = questionText.replace(/[\.\$\#\[\]\/]/g, "_").trim();
                  const sanitizedOption = selectedOption.replace(/[\.\$\#\[\]\/]/g, "_").trim();
                  
                  const statsRef = firebase.database().ref("stats/" + sanitizedQuestion);
                  await statsRef.transaction((currentData) => {
                      if (currentData === null) {
                          currentData = {
                              questionText: questionText,
                              totalAttempts: 0,
                              correctAttempts: 0,
                              correctPercentage: 0,
                              selections: {}
                          };
                      }
                      
                      // Safely initialize fields if they are missing
                      if (!currentData.selections) {
                          currentData.selections = {};
                      }
                      
                      // Increment totals
                      currentData.totalAttempts = (currentData.totalAttempts || 0) + 1;
                      if (isCorrect) {
                          currentData.correctAttempts = (currentData.correctAttempts || 0) + 1;
                      }
                      
                      // Calculate correct percentage
                      currentData.correctPercentage = Math.round((currentData.correctAttempts / currentData.totalAttempts) * 100);
                      
                      // Increment count for this specific option selected by the user
                      currentData.selections[sanitizedOption] = (currentData.selections[sanitizedOption] || 0) + 1;
                      
                      return currentData;
                  });
                  console.log("[Firebase] Successfully updated aggregated metrics in Realtime Database!");
              } catch (e) {
                  console.warn("[Firebase] Aggregated stats transaction skipped or failed:", e.message);
              }
          } catch (globalError) {
              console.error("[Firebase] Error in firebaseLogAnswer:", globalError.message);
          }
      };
    </script>
  </body>
</html>
